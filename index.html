<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolblathanna | South Coast Sri Lanka Travel Guide</title>
    <meta name="description" content="Your local guide to South Coast Sri Lanka — Galle, Unawatuna, Weligama, Mirissa, Ahangama and Tangalle — from the Dolblathanna team, rooted in Ahangama.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./guides-shared/guide.css">
    <link rel="stylesheet" href="./app-mode.css">
</head>
<body>
    <div id="app">
        <canvas id="three-canvas"></canvas>

        <!-- App mode IS the homepage now — it loads open by default (#app-mode.is-open-by-default in
             app-mode.css, no FAB tap required) rather than being an optional overlay entered via a
             compass button. The old FAB + slim traditional hero were removed entirely: with app mode
             always showing on load, a visitor would never actually see them, so they were dead UI, not
             a real fallback view. Guides-teaser/Rooms/Rentals/About/Contact remain fully absorbed into
             topic content inside app mode (see trip-planner.js) rather than existing as separate
             sections. -->
        <div id="app-mode" class="is-open is-homepage">
            <div class="app-bar">
                <button class="app-back" id="app-back-btn" type="button" aria-label="Back">&larr;</button>
                <div class="app-bar-logo"><img src="./brand/logo.png" alt="Dolblathanna"></div>
                <button class="app-bar-about" id="app-about-btn" type="button">About Us</button>
            </div>
            <div id="app-scroll" class="app-scroll">
                <!-- Timeline list screen -->
                <div id="timeline-screen" class="timeline-list">
                    <div class="timeline-intro">
                        <h2>Your Trip, Step by Step</h2>
                        <p>Everything a South Coast trip needs — go through each one.</p>
                    </div>
                    <div id="timeline-items"></div>
                </div>

                <!-- Topic detail screen (four layers: Guide / Go Deeper / Platforms / Visitors Also Checked) -->
                <div id="topic-detail" class="topic-detail">
                    <div class="topic-detail-header">
                        <span id="focus-icon" class="topic-detail-icon"></span>
                        <div>
                            <h2 id="focus-title"></h2>
                            <p id="focus-blurb"></p>
                        </div>
                    </div>

                    <div class="layer-heading"><span class="layer-num">1</span> The General Guide</div>
                    <div id="planner-general" class="planner-general"></div>

                    <div id="topic-map-section" class="topic-map-wrap" style="display:none;">
                        <div id="topic-map" class="topic-map"></div>
                        <div class="topic-map-caption">Places mentioned in this guide — tap a pin for a quick note.</div>
                    </div>

                    <div class="layer-heading"><span class="layer-num">2</span> Go Deeper</div>
                    <div id="planner-recommendations" class="deeper-groups"></div>

                    <div class="cta-section">
                        <div class="layer-heading"><span class="layer-num">3</span> <span id="cta-label"></span></div>
                        <div id="planner-cards" class="platform-cards"></div>
                    </div>

                    <div class="layer-heading"><span class="layer-num">4</span> Visitors Also Checked</div>
                    <div id="planner-nextup" class="planner-recommendations"></div>
                </div>

                <!-- About Us screen -->
                <div id="about-screen" class="topic-detail">
                    <h2>Our Story</h2>
                    <p id="about-bio"></p>
                    <div id="about-social"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="./main.js"></script>
    <script type="module" src="./app-mode.js"></script>
</body>
</html>
